[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "megabake"
version = "0.1.0"
description = "torch.export to megakernel: compile once, distribute everywhere"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "transformers>=4.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "v3_gpu: requires a selected CUDA device and defers device checks until test setup",
    "v3_toolchain: requires the selected CUDA toolchain, normally nvcc",
    "v3_slow: an intentionally slow V3 correctness or evidence test",
]
